# Local disposable protected-log demo. Deletion is enabled for the built-in "fake" tenant.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Allow explicit delete requests without age-based retention of other demo logs.
limits_config:
  deletion_mode: filter-and-delete
  retention_period: 0s

compactor:
  working_directory: /tmp/loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  # Short delays make an asynchronous request observable in this disposable demo.
  compaction_interval: 1m
  delete_request_cancel_period: 1m
  retention_delete_delay: 1m
