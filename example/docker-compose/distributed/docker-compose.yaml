services:
  # tempo, backend and kafka
  distributor:
    image: &tempoImage "tempo-protected-tempo:dev"
    build:
      context: ../../..
      dockerfile: Dockerfile.protected-demo
    environment: &tempoEnvironment
     - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
    depends_on:
      - redpanda
    command: "-target=distributor -config.file=/etc/tempo.yaml"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"

  live-store-zone-a-0:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=live-store -config.file=/etc/tempo.yaml -live-store.instance-availability-zone=zone-a"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3201:3200" # tempo
    hostname: live-store-zone-a-0

  live-store-zone-a-1:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=live-store -config.file=/etc/tempo.yaml -live-store.instance-availability-zone=zone-a"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"
    hostname: live-store-zone-a-1

  live-store-zone-b-0:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=live-store -config.file=/etc/tempo.yaml -live-store.instance-availability-zone=zone-b"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"
    hostname: live-store-zone-b-0

  live-store-zone-b-1:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=live-store -config.file=/etc/tempo.yaml -live-store.instance-availability-zone=zone-b"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"
    hostname: live-store-zone-b-1

  query-frontend:
    image: *tempoImage
    environment: *tempoEnvironment
    command: "-target=query-frontend -config.file=/etc/tempo.yaml -log.level=debug"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3202:3200" # tempo

  querier:
    image: *tempoImage
    environment: *tempoEnvironment
    command: "-target=querier -config.file=/etc/tempo.yaml -log.level=debug"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"

  backend-scheduler:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - minio
    command: "-target=backend-scheduler -config.file=/etc/tempo.yaml"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"

  backend-worker-0:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - backend-scheduler
    hostname: backend-worker-0
    command: "-target=backend-worker -config.file=/etc/tempo.yaml"
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"

  metrics-generator-0:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=metrics-generator -config.file=/etc/tempo.yaml"
    hostname: metrics-generator-0
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"

  metrics-generator-1:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=metrics-generator -config.file=/etc/tempo.yaml"
    hostname: metrics-generator-1
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"

  block-builder-0:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=block-builder -config.file=/etc/tempo.yaml"
    hostname: block-builder-0
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"

  block-builder-1:
    image: *tempoImage
    environment: *tempoEnvironment
    depends_on:
      - distributor
    command: "-target=block-builder -config.file=/etc/tempo.yaml"
    hostname: block-builder-1
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200"

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    environment:
      - MINIO_ACCESS_KEY=tempo
      - MINIO_SECRET_KEY=supersecret
    ports:
      - "9001:9001"
    entrypoint:
      - sh
      - -euc
      - mkdir -p /data/tempo && silo server /data --console-address ':9001'

  redpanda:
    image: redpandadata/redpanda:latest
    ports:
      - "9092:9092" # Kafka API for clients
    command: >
      redpanda start --overprovisioned
      --mode=dev-container
      --kafka-addr=PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr=PLAINTEXT://redpanda:9092

  # this is a hack to force there to always be a topic with 2 partitions so the example works
  # todo: remove this once we properly always set the partitions correctly
  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      - redpanda
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        # Wait for Redpanda to be ready
        until rpk cluster info --brokers redpanda:9092 2>/dev/null; do
          echo "Waiting for Redpanda to be ready..."
          sleep 2
        done

        # Create topic with a partition if it doesn't exist and then add 1 to force 2 total
        rpk topic create tempo-ingest --partitions 1 --brokers redpanda:9092 || true
        rpk topic add-partitions tempo-ingest --num 1 --brokers redpanda:9092 || true

        echo "Topic tempo-ingest created with 2 partitions ... probably"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.5.0@sha256:b2cbdd93dee412142f95a61488118f33b8e31ea576bfb3ce625fbaffbdf0803a
    environment:
      - CONFIG_FILEPATH=/etc/redpanda/redpanda-console-config.yaml
    volumes:
      - ./redpanda-console.yaml:/etc/redpanda/redpanda-console-config.yaml
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  # Existing broad trace traffic continues alongside the deterministic protected demo.
  k6-tracing:
    image: ghcr.io/grafana/xk6-client-tracing:v0.0.9
    environment:
      - ENDPOINT=alloy:4317
    restart: always
    depends_on:
      - alloy

  # Alloy protects selected log fields before forwarding to Loki.
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100" # The unauthenticated compactor API must not be exposed remotely.

  secret-logs:
    image: python:3.12-alpine
    command: ["python", "-u", "/opt/demo/generate-secret-logs.py"]
    environment:
      LOKI_PUSH_URL: http://alloy-logs:3500/loki/api/v1/push
    volumes:
      - ./generate-secret-logs.py:/opt/demo/generate-secret-logs.py:ro
    restart: "no" # Keep the finite demo batch stopped after it finishes, including during deletion.
    depends_on:
      - alloy-logs

  alloy-logs:
    build:
      context: ../../../../alloy
      dockerfile: Dockerfile.encrypted-otel
    image: tempo-protected-alloy:dev
    command: ["run", "--stability.level=experimental", "--storage.path=/tmp/alloy-logs", "/etc/alloy/logs.alloy"]
    volumes:
      - ./alloy-logs.alloy:/etc/alloy/logs.alloy:ro
      - ./test-customer-key:/etc/alloy/customer-key:ro
      - ./test-attribute-key:/etc/alloy/token-key:ro
    depends_on:
      - loki

  secret-traces:
    image: python:3.12-alpine
    command: ["python", "-u", "/opt/demo/generate-secret-traces.py"]
    environment:
      OTLP_ENDPOINT: http://alloy:4318/v1/traces
    volumes:
      - ./generate-secret-traces.py:/opt/demo/generate-secret-traces.py:ro
    restart: always
    depends_on:
      - alloy
  alloy:
    build:
      context: ../../../../alloy
      dockerfile: Dockerfile.encrypted-otel
    image: tempo-protected-alloy:dev
    command: ["otel", "--config=/etc/alloy/otel.yaml"]
    volumes:
      - ./alloy-otel.yaml:/etc/alloy/otel.yaml:ro
      # Public test fixtures only. The keys are never mounted into Grafana or Tempo.
      - ./test-attribute-key:/etc/alloy/secret-key:ro
      - ./test-customer-key:/etc/alloy/customer-key:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - distributor

  # supporting services - metrics and visualization
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  grafana-base:
    scale: 0 # Build dependency only; never launch a second Grafana container.
    build:
      context: ../../../../grafana-h
      dockerfile: Dockerfile
    image: tempo-protected-grafana-base:dev

  grafana:
    build:
      context: ../../../../tempo-datasource
      dockerfile: Dockerfile.protected-demo
      additional_contexts:
        grafana-base: service:grafana-base
        loki-plugin: ../../../../grafana-loki-datasource
    image: tempo-protected-grafana:dev
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana-protected-data-app.yaml:/etc/grafana/provisioning/plugins/protected-data-app.yaml:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DEFAULT_APP_MODE=development
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=tempo,loki,protected-data-app
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary
      - GF_FEATURE_TOGGLES_splashScreen=false
    ports:
      - "127.0.0.1:3000:3000" # Anonymous Admin is intentionally local to this disposable demo.

  vulture:
    image: "grafana/tempo-vulture:${TEMPO_IMAGE_TAG:-3.0.0}"
    restart: always
    command:
      [
        "-prometheus-listen-address=:8080",
        "-tempo-query-url=http://query-frontend:3200",
        "-tempo-push-url=http://distributor:4317",
      ]
    depends_on:
      - distributor

  memcached:
    image: memcached:1.6
    ports:
      - "11211:11211"
